<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Kelamin {
            display: grid;
        }
        
    </style>
</head>
<body>
    <div class="wadah">
    <h3>Tambah Data Siswa</h3>
    <div class="form">
    <form>

        <table>
            <div>
            <tr class="NIS">
                <td>
                    <label for="nis">NIS</label>
                    <input type="text" id="nis" name="nis" placeholder="Masukan nis">
                </td>
            </tr>

            <div class="Kelamin">
                <tr>
                <td>
                    <label for="jenis">Jenis kelamin</label>
                    <input type="radio" name="jenis-kelamin" value="laki-laki" cheked> Laki laki
                    <input type="radio" name="jenis-kelamin" value="perempuan" cheled> Perempuan
                </td>
            </tr>
            </div>

            <tr class="Nama">
                <td>
                    <label for="nama"> Nama lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukan nama lengkap">
                </td>
            </tr>

            <tr class="Kelas">
                <td>
                    <label for="kelas">Kelas</label>
                    <select id="kelas" nama="kelas">
                        <option value="">Pilih kelas</option>
                            <option value="X RPL 1">X RPL 1</option>
                            <option value="X RPL 2">X RPL 2</option>
                            <option value="X RPL 3">X RPL 3</option>
                            <option value="XI RPL 1">XI RPL 1</option>
                            <option value="XI RPL 2">XI RPL 2</option>
                            <option value="XII RPL 1">XII RPL 1</option>
                    </select>
                </td>
            </tr>
            

                <tr class="Tanggal-lahir">
                    <td>
                        <label for="tanggal">Tanggal lahir</label>
                        <input type="date" name="tanggal" value="tanggal-lahir">
                    </td>
                </tr>
            </div>
        </div>
        </table>

            <br>
            <button class="simpan" type="submit"> + Simpan</button>
                <button class="simpan" type="reset"> + Reset</button>


    </form>
    
</body>
</html>
