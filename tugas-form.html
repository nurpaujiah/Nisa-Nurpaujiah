<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wadah {
            display: flex;
            height: 100%;
            width: 100%;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .isi {
            width: 30%;
            height: 50%;
            padding: 30px;
            border: 1px solid grey;
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            background-color: pink;
        }

        h3 {
            text-align: center;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;

        }

        .row label:first-child {
            width: 140px;
        }
        .row label {
            width: 150px;
        }
        .row input, .row select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius:3px;
            box-sizing: border-box;
        }
        .row input{
            min-width:0;
        }
        .row input[type="number"] {
            width: 80px;
        
        }
        .row input[type="tel"] {
            width: 80px;
        }
        .row input[type="text"] {
            width: 180px;
        }
        .btnSubmit {
            width: 30%;
            align-self: center;
            border-radius: 10px;
            padding: 10px;
            background-color: #eeeeee;
            color: black;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="wadah">
        <div class="isi">
            <h3>Student Registration Form</h3>
            <form action="" style="display: flex; flex-direction: column;">

                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" placeholder="enter your student id" required>
                </div>
                <div class="form-group">
                    <label for="nomor">Roll no</label>
                    <td><input type="number" id="nomor" placeholder="enter your roll no" required></td>
                </tr>
                <tr>
                    <td class="row"><label for="Student name">Student name :</label></td>
                    <td style="display: flex; gap: 10px;">
                        <input type="text" placeholder="First name" required style="width: 50%;">
                        <input type="text" placeholder="Last name" required style="width: 50%;">
                    </td>
                </tr>

                <tr>
                    <td class="label"><label for="father-name">Father's name</label></td>
                    <td><input type="text" id="father-name" placeholder="enter your father's name" required></td>
                </tr>

                <div class="row">
                <tr>
                    <label for="tanggal">Date of birth :</label>
                    <input type="number" id="tanggal" name="day" placeholder="DD" min="1" max="31">
                    <span>-</span>
                    <input type="number" name="month" placeholder="MM" min="1" max="12">
                    <span>-</span>
                    <input type="number" name="year" placeholder="YYYY" min="1900" max="2100">
                </tr>
                </div>

                <div class="row">
                    <label for="mobile">Mobile no :</label>
                    <select name="country-code" id="country-code">
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                        <option value="+91">+91</option>
                        <option value="+62">+62</option>
                    </select>
                    <td><input type="tel" id="mobile" placeholder="enter your mobile no" required></td>
                </div>

                <tr>
                    <td class="label"><label for="email">Email</label></td>
                    <td><input type="email" placeholder="enter your email" required></td>
                </tr>

                <tr>
                    <td class="label"><label for="password">Password</label></td>
                    <td><input type="password" placeholder="enter your password"></td>
                </tr>

                <tr>
                    <label for="gender">Gender</label>
                    <div style="display:flex; gap: 20px; margin-top: 5px;">
                        <label style="display: flex; align-items: center; gap: 5px;" name="gender" value="male">
                            <input type="radio" name="gender" value="male">Male
                        </label>
                        <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="radio" name="gender" value="female">Female
                        </label>
                    </div>
                </tr>

                <tr>
                    <label>Department:</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px;"> <label
                            style="display: flex; align-items: center; gap: 5px;"> <input type="checkbox" name="dept"
                                value="CSE"> CSE </label> <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" name="dept" value="IT"> IT </label> <label
                            style="display: flex; align-items: center; gap: 5px;"> <input type="checkbox" name="dept"
                                value="ECE"> ECE </label> <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" name="dept" value="Civil"> Civil </label> <label
                            style="display: flex; align-items: center; gap: 5px;"> <input type="checkbox" name="dept"
                                value="Mech"> Mech </label> </div>
                    </td>
                </tr>

                <tr>
                    <td class="pilihan"><label for="course">Course:</label></td>
                    <select name="course" id="course">
                        <option value="">--Select Current Course's--</option>
                        <option value="rpl">Rekayasa Perangkat Lunak</option>
                        <option value="tsm">Teknik Sepeda Motor</option>
                        <option value="atph">Agribisnis tanaman pangan dan holtikultura</option>
                </tr>


                </select>
                <tr>
                    <td><label for="foto">Student Foto</label></td>
                    <td><input type="file" id="foto" name="foto"></td>
                </tr>

                <tr>
                    <td><label for="tempat tinggal">City</label></td>
                    <td><input type="text" id="tempat tinggal" placeholder="enter your city" required></td>
                </tr>

                <tr>
                    <td><label for="alamat">Address</label></td>
                    <td><textarea name="alamat" id="alamat" cols="30" rows="5"
                            placeholder="enter your address"></textarea></td>

                </tr>
             <button class="btnSubmit" type="submit">Log in</button>

            </form>

        </div>
    </div>
</body>

</html>
